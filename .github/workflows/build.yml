name: Build MOS (Mighty OS)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-mos:
    runs-on: ubuntu-24.04

    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Install Base Tools inside Debian
        run: |
          apt-get update
          apt-get install -y live-build debootstrap wget git coreutils xz-utils

      - name: Checkout Repository Files
        uses: actions/checkout@v4

      - name: Setup System Resources & Images from Assets Folder
        run: |
          # Create required system directories
          mkdir -p config/includes.chroot/usr/share/backgrounds/mos/
          mkdir -p config/includes.chroot/boot/grub/

          # Copy wallpapers from the assets folder
          cp assets/wallpaper.jpg config/includes.chroot/usr/share/backgrounds/mos/default.jpg || true
          cp assets/bg1.jpg config/includes.chroot/usr/share/backgrounds/mos/bg1.jpg || true
          cp assets/bg2.jpg config/includes.chroot/usr/share/backgrounds/mos/bg2.jpg || true
          cp assets/bg3.jpg config/includes.chroot/usr/share/backgrounds/mos/bg3.jpg || true

          # Copy Boot image from the assets folder
          cp assets/boot.jpg config/includes.chroot/boot/grub/mos-boot.jpg || true

      - name: Enable Flathub Setup Service
        run: |
          mkdir -p config/includes.chroot/etc/systemd/system/multi-user.target.wants/
          ln -s /etc/systemd/system/flatpak-flathub-setup.service config/includes.chroot/etc/systemd/system/multi-user.target.wants/flatpak-flathub-setup.service

      - name: Compile MOS ISO
        run: |
          lb config --architectures amd64 \
                    --distribution bookworm \
                    --binary-images iso-hybrid \
                    --archive-areas "main contrib non-free non-free-firmware"
          lb build

      - name: Release MOS ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MOS-Mighty-Smooth-ISO
          path: "*.iso"
          compression-level: 0
