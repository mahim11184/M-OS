name: Build MOS (Mighty OS) - Container Fixed

on:
  workflow_dispatch:

jobs:
  build-mos:
    # গিটহাবের সার্ভার রান হবে
    runs-on: ubuntu-24.04

    # আমরা সরাসরি ডেবিয়ানের অফিশিয়াল কন্টেইনারের ভেতর পুরো কাজটা করব
    container:
      image: debian:bookworm
      options: --privileged # সব ধরনের ফাইল তৈরির পারমিশন লক করার জন্য

    steps:
    - name: Install Base Tools inside Debian
      run: |
        apt-get update
        apt-get install -y live-build debootstrap wget git coreutils xz-utils

    - name: Checkout Blueprint
      uses: actions/checkout@v4

    - name: Configure and Compile MOS ISO
      run: |
        # এবার পিউর ডেবিয়ান থেকে কনফিগারেশন রান হবে, কোনো উবুন্টুর এরর আসবে না
        lb config --architectures amd64 \
                  --distribution bookworm \
                  --binary-images iso-hybrid \
                  --archive-areas "main contrib non-free non-free-firmware"
        
        # ৩ জিবির নিচে রাখার জন্য প্রয়োজনীয় প্যাকেজ লিস্ট
        mkdir -p config/package-lists
        cat <<EOF > config/package-lists/mos-core.list.chroot
        xorg
        sddm
        plasma-desktop
        plasma-nm
        powerdevil
        kscreen
        dolphin
        konsole
        calamares
        firefox-esr
        EOF

        # HDD অপ্টিমাইজেশন: Baloo (সার্চ ইনডেক্সার) বন্ধ
        mkdir -p config/includes.chroot/etc/xdg
        cat <<EOF > config/includes.chroot/etc/xdg/baloofilerc
        [Basic Settings]
        Indexing-Enabled=false
        EOF

        # নিয়ন ডার্ক থিম সেটআপ
        cat <<EOF > config/includes.chroot/etc/xdg/kdeglobals
        [KDE]
        LookAndFeelPackage=org.kde.breezedark.desktop
        EOF

        # হাই এফপিএস এর জন্য উইন্ডো অ্যানিমেশন বন্ধ
        cat <<EOF > config/includes.chroot/etc/xdg/kwinrc
        [org.kde.kdecoration2]
        theme=org.kde.breezedark
        [Compositing]
        Enabled=true
        AnimationSpeed=0
        Backend=OpenGL
        WindowsBlockCompositing=true
        EOF

        # নতুন ইউজারের জন্য থিম প্রোফাইল কপি করা
        mkdir -p config/includes.chroot/etc/skel/.config
        cp config/includes.chroot/etc/xdg/kdeglobals config/includes.chroot/etc/skel/.config/kdeglobals
        cp config/includes.chroot/etc/xdg/kwinrc config/includes.chroot/etc/skel/.config/kwinrc

        # ওয়ালপেপার ডিরেক্টরি তৈরি করে ডাউনলোড করা
        mkdir -p config/includes.chroot/usr/share/wallpapers/mos-neon/contents/images/
        wget -q -O config/includes.chroot/usr/share/wallpapers/mos-neon/contents/images/1920x1080.png "https://prodia.xyz" || echo "Wallpaper download skipped"

        # প্লাজমাতে ডিফল্ট ওয়ালপেপার রেজিস্ট্রি করা
        cat <<EOF > config/includes.chroot/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc
        [Containments]
        plugin=org.kde.plasma.folder
        wallpaperplugin=org.kde.image
        [Containments][Wallpaper][org.kde.image][General]
        Image=/usr/share/wallpapers/mos-neon/contents/images/1920x1080.png
        EOF

        # ওএস কম্পাইল শুরু
        lb build

    - name: Release MOS ISO
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: MOS-Mighty-Smooth-ISO
        path: "*.iso"
        compression-level: 0
