name: Build Mighty Linux ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mighty-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debian Bookworm live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            isolinux syslinux-common ca-certificates wget git xz-utils gnupg

      - name: Stage Mighty Linux artwork
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0644 wallpaper.jpg \
            config/includes.chroot/usr/share/backgrounds/mighty-linux/wallpaper.jpg

          mkdir -p config/includes.chroot/usr/share/backgrounds/mighty-linux
          shopt -s nullglob
          for image in assets/bg*.jpg assets/bg*.png; do
            install -m 0644 "$image" \
              "config/includes.chroot/usr/share/backgrounds/mighty-linux/$(basename "$image")"
          done

          install -D -m 0644 assets/boot.jpg \
            config/includes.chroot/usr/share/plymouth/themes/mighty-linux/boot.jpg
          install -D -m 0644 assets/boot.jpg \
            config/includes.chroot/boot/grub/mighty-linux.jpg

      - name: Enable first-boot Flathub setup
        run: |
          mkdir -p config/includes.chroot/etc/systemd/system/multi-user.target.wants
          ln -sfn ../flatpak-flathub-setup.service \
            config/includes.chroot/etc/systemd/system/multi-user.target.wants/flatpak-flathub-setup.service

      - name: Validate build configuration
        run: |
          test -s config/package-lists/mos-core.list.chroot
          test -s config/includes.chroot/etc/systemd/system/flatpak-flathub-setup.service
          test -s config/includes.chroot/usr/share/plymouth/themes/mighty-linux/mighty-linux.plymouth
          test -s config/includes.chroot/usr/share/plymouth/themes/mighty-linux/mighty-linux.script
          test -s config/includes.chroot/usr/share/plymouth/themes/mighty-linux/boot.jpg
          grep -qx 'libfuse2' config/package-lists/mos-core.list.chroot
          grep -qx 'flatpak' config/package-lists/mos-core.list.chroot

      - name: Make live-build hooks executable
        run: chmod +x config/hooks/live/*.hook.chroot

      - name: Configure and build hybrid ISO
        run: |
          lb config \
            --architectures amd64 \
            --distribution bookworm \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --image-name mighty-linux \
            --iso-application "Mighty Linux" \
            --iso-publisher "Mighty Linux by MOS" \
            --iso-volume "MIGHTY_LINUX" \
            --bootappend-live "boot=live components quiet splash"
          lb build

      - name: Generate SHA-256 checksums
        run: |
          set -e
          shopt -s nullglob
          images=( *.iso )
          test "${#images[@]}" -gt 0
          sha256sum "${images[@]}" > SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: mighty-linux-iso
          path: |
            *.iso
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.1.0-build-${{ github.run_number }}"
          name: "Mighty Linux 1.1.0 — build ${{ github.run_number }}"
          body: |
            Automated Mighty Linux alpha build based on Debian Bookworm.

            Desktop: XFCE + Openbox
            Application formats: DEB, Flatpak, AppImage
            Architecture: amd64

            See SHA256SUMS to verify the ISO download.
          prerelease: true
          files: |
            *.iso
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
