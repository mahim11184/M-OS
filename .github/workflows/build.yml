name: Build MOS (Mighty OS)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-mos:
    runs-on: ubuntu-24.04

    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Install Base Tools inside Debian
        run: |
          apt-get update
          apt-get install -y live-build debootstrap wget git coreutils xz-utils

      - name: Checkout Blueprint
        uses: actions/checkout@v4

      - name: Configure and Compile MOS ISO
        run: |
          # Debian Live-Build Configuration
          lb config --architectures amd64 \
                    --distribution bookworm \
                    --binary-images iso-hybrid \
                    --archive-areas "main contrib non-free non-free-firmware"
          
          # Package List Setup
          mkdir -p config/package-lists
          echo "xorg" > config/package-lists/mos-core.list.chroot
          echo "sddm" >> config/package-lists/mos-core.list.chroot
          echo "plasma-desktop" >> config/package-lists/mos-core.list.chroot
          echo "plasma-nm" >> config/package-lists/mos-core.list.chroot
          echo "powerdevil" >> config/package-lists/mos-core.list.chroot
          echo "kscreen" >> config/package-lists/mos-core.list.chroot
          echo "dolphin" >> config/package-lists/mos-core.list.chroot
          echo "konsole" >> config/package-lists/mos-core.list.chroot
          echo "calamares" >> config/package-lists/mos-core.list.chroot
          echo "calamares-settings-debian" >> config/package-lists/mos-core.list.chroot
          echo "firefox-esr" >> config/package-lists/mos-core.list.chroot
          echo "fastfetch" >> config/package-lists/mos-core.list.chroot
          echo "htop" >> config/package-lists/mos-core.list.chroot
          echo "curl" >> config/package-lists/mos-core.list.chroot
          echo "git" >> config/package-lists/mos-core.list.chroot
          echo "zram-tools" >> config/package-lists/mos-core.list.chroot

          # Enable ZRAM Configuration
          mkdir -p config/includes.chroot/etc/default/
          echo "ALGORITHM=lz4" > config/includes.chroot/etc/default/zramswap
          echo "PERCENT=50" >> config/includes.chroot/etc/default/zramswap

          # Disable Baloo Indexer
          mkdir -p config/includes.chroot/etc/xdg
          echo "[Basic Settings]" > config/includes.chroot/etc/xdg/baloofilerc
          echo "Indexing-Enabled=false" >> config/includes.chroot/etc/xdg/baloofilerc

          # KDE Theme Setup
          echo "[KDE]" > config/includes.chroot/etc/xdg/kdeglobals
          echo "LookAndFeelPackage=org.kde.breezedark.desktop" >> config/includes.chroot/etc/xdg/kdeglobals

          # Window Tweaks Setup
          echo "[org.kde.kdecoration2]" > config/includes.chroot/etc/xdg/kwinrc
          echo "theme=org.kde.breezedark" >> config/includes.chroot/etc/xdg/kwinrc
          echo "[Compositing]" >> config/includes.chroot/etc/xdg/kwinrc
          echo "Enabled=true" >> config/includes.chroot/etc/xdg/kwinrc
          echo "AnimationSpeed=0" >> config/includes.chroot/etc/xdg/kwinrc
          echo "Backend=OpenGL" >> config/includes.chroot/etc/xdg/kwinrc
          echo "WindowsBlockCompositing=true" >> config/includes.chroot/etc/xdg/kwinrc

          # FASTFETCH ASCII LOGO VIA BASE64
          mkdir -p config/includes.chroot/etc/skel/.config/fastfetch
          echo "G2VsY29tZSB0byBNT1M=" | base64 -d > /dev/null
          echo "IBtbMzZtICAgX18gIF9fICAbWzMybSAgX18gIF9fX18gIBtbMG0KIBtbMzZtICB8ICBcLyAgfCAbWzMybS8gXyBcLyBfX198IBtbMG0KIBtbMzZtICB8IHxcL3wgfCAbWzMybXwgfCB8IFxfX18gIBtbMG0KIBtbMzZtICB8IHwgIHwgfCAbWzMybXwgfF98IHwgX19fKSB8G1swbQogG1szNm0gIHxffCAgfF98IBtbMzJtIFxfX18vfF9fX18vIBtbMG0K" | base64 -d > config/includes.chroot/etc/skel/.config/fastfetch/mos.txt

          # Fastfetch Config Setup
          echo '{"$schema":"https://github.com/fastfetch-cli/fastfetch/raw/dev/doc/json_schema.json","logo":{"type":"raw","source":"~/.config/fastfetch/mos.txt"},"modules":["title","separator","os","host","kernel","uptime","packages","shell","wm","memory","disk"]}' > config/includes.chroot/etc/skel/.config/fastfetch/config.jsonc

          # Auto-start Fastfetch on Konsole
          mkdir -p config/includes.chroot/etc/skel/
          echo 'if [ -f /usr/bin/fastfetch ]; then fastfetch -c ~/.config/fastfetch/config.jsonc; fi' >> config/includes.chroot/etc/skel/.bashrc

          # Copy Theme Config to Skel
          mkdir -p config/includes.chroot/etc/skel/.config
          cp config/includes.chroot/etc/xdg/kdeglobals config/includes.chroot/etc/skel/.config/kdeglobals
          cp config/includes.chroot/etc/xdg/kwinrc config/includes.chroot/etc/skel/.config/kwinrc

          # Desktop Wallpaper Setup
          mkdir -p config/includes.chroot/usr/share/wallpapers/mos-neon/contents/images/
          wget -q -O config/includes.chroot/usr/share/wallpapers/mos-neon/contents/images/1920x1080.png "https://raw.githubusercontent.com/mahim11184/M-OS/main/wallpaper.jpg" || echo "Wallpaper download skipped"

          # Wallpaper Registry Setup
          echo "[Containments][1]" > config/includes.chroot/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc
          echo "plugin=org.kde.plasma.folder" >> config/includes.chroot/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc
          echo "wallpaperplugin=org.kde.image" >> config/includes.chroot/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc
          echo "[Containments][1][Wallpaper][org.kde.image][General]" >> config/includes.chroot/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc
          echo "Image=/usr/share/wallpapers/mos-neon/contents/images/1920x1080.png" >> config/includes.chroot/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc

          # Calamares Branding Setup
          mkdir -p config/includes.chroot/etc/calamares/branding/mos
          echo "componentName: mos" > config/includes.chroot/etc/calamares/branding/mos/branding.desc
          echo "welcomeStyleCalamares: false" >> config/includes.chroot/etc/calamares/branding/mos/branding.desc
          echo "welcomeExpandingWallpaper: true" >> config/includes.chroot/etc/calamares/branding/mos/branding.desc
          echo "shortProductName: MOS" >> config/includes.chroot/etc/calamares/branding/mos/branding.desc
          echo "version: 1.0" >> config/includes.chroot/etc/calamares/branding/mos/branding.desc
          echo "shortVersion: 1.0" >> config/includes.chroot/etc/calamares/branding/mos/branding.desc
          echo "versionedName: Mighty OS 1.0" >> config/includes.chroot/etc/calamares/branding/mos/branding.desc
          echo "shortVersionedName: MOS 1.0" >> config/includes.chroot/etc/calamares/branding/mos/branding.desc
          echo "productName: Mighty OS" >> config/includes.chroot/etc/calamares/branding/mos/branding.desc
          echo "productUrl: https://github.com/mahim11184/M-OS" >> config/includes.chroot/etc/calamares/branding/mos/branding.desc
          echo "supportUrl: https://github.com/mahim11184/M-OS" >> config/includes.chroot/etc/calamares/branding/mos/branding.desc
          echo "slideshow: show.qml" >> config/includes.chroot/etc/calamares/branding/mos/branding.desc

          # Calamares Slideshow Setup
          echo 'import QtQuick 2.0' > config/includes.chroot/etc/calamares/branding/mos/show.qml
          echo 'import calamares.slideshow 1.0' >> config/includes.chroot/etc/calamares/branding/mos/show.qml
          echo 'Presentation {' >> config/includes.chroot/etc/calamares/branding/mos/show.qml
          echo '    id: presentation' >> config/includes.chroot/etc/calamares/branding/mos/show.qml
          echo '    Timer { interval: 4000; running: true; repeat: true; onTriggered: presentation.goToNextSlide() }' >> config/includes.chroot/etc/calamares/branding/mos/show.qml
          echo '    Slide { Text { anchors.centerIn: parent; text: "Welcome to Mighty OS (MOS)\n\nLightweight. High Performance. Pure Speed."; color: "#00d2ff"; font.pixelSize: 22; font.bold: true; horizontalAlignment: Text.AlignHCenter } }' >> config/includes.chroot/etc/calamares/branding/mos/show.qml
          echo '    Slide { Text { anchors.centerIn: parent; text: "Optimized for Low-End & High-End PCs\n\nEnjoy smooth KDE Plasma Experience with ZRAM Tech."; color: "#ffffff"; font.pixelSize: 20; horizontalAlignment: Text.AlignHCenter } }' >> config/includes.chroot/etc/calamares/branding/mos/show.qml
          echo '}' >> config/includes.chroot/etc/calamares/branding/mos/show.qml

          # GRUB Boot Background Setup
          mkdir -p config/includes.chroot/boot/grub/
          wget -q -O config/includes.chroot/boot/grub/mos-boot.jpg "https://raw.githubusercontent.com/mahim11184/M-OS/main/boot.jpg" || echo "Boot image download skipped"

          mkdir -p config/includes.chroot/etc/default/grub.d
          echo 'GRUB_BACKGROUND="/boot/grub/mos-boot.jpg"' > config/includes.chroot/etc/default/grub.d/mos-theme.cfg
          echo 'GRUB_GFXMODE="1920x1080,auto"' >> config/includes.chroot/etc/default/grub.d/mos-theme.cfg

          # Start ISO Construction
          lb build

      - name: Release MOS ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MOS-Mighty-Smooth-ISO
          path: "*.iso"
          compression-level: 0
