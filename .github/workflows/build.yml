name: Build Mighty Linux ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mighty-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debian Bookworm live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            isolinux syslinux-common ca-certificates wget git xz-utils gnupg

      - name: Stage Mighty Linux artwork
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0644 wallpaper.jpg \
            config/includes.chroot/usr/share/backgrounds/mighty-linux/wallpaper.jpg

          mkdir -p config/includes.chroot/usr/share/backgrounds/mighty-linux
          shopt -s nullglob
          for image in assets/bg*.jpg assets/bg*.png; do
            install -m 0644 "$image" \
              "config/includes.chroot/usr/share/backgrounds/mighty-linux/$(basename "$image")"
          done

          install -D -m 0644 assets/boot.jpg \
            config/includes.chroot/usr/share/plymouth/themes/mighty-linux/boot.jpg
          install -D -m 0644 assets/boot.jpg \
            config/includes.chroot/boot/grub/mighty-linux.jpg

      - name: Enable first-boot Flathub setup
        run: |
          mkdir -p config/includes.chroot/etc/systemd/system/multi-user.target.wants
          ln -sfn ../flatpak-flathub-setup.service \
            config/includes.chroot/etc/systemd/system/multi-user.target.wants/flatpak-flathub-setup.service

      - name: Validate build configuration
        run: |
          test -s config/package-lists/mos-core.list.chroot
          test -s config/includes.chroot/etc/systemd/system/flatpak-flathub-setup.service
          test -s config/includes.chroot/usr/share/plymouth/themes/mighty-linux/mighty-linux.plymouth
          test -s config/includes.chroot/usr/share/plymouth/themes/mighty-linux/mighty-linux.script
          test -s config/includes.chroot/usr/share/plymouth/themes/mighty-linux/boot.jpg
          grep -qx 'libfuse2' config/package-lists/mos-core.list.chroot
          grep -qx 'flatpak' config/package-lists/mos-core.list.chroot

      - name: Make live-build hooks executable
        run: chmod +x config/hooks/live/*.hook.chroot

      - name: Configure and build hybrid ISO
        run: |
          lb config \
            --architectures amd64 \
            --distribution bookworm \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --image-name mighty-linux \
            --iso-application "Mighty Linux" \
            --iso-publisher "Mighty Linux by MOS" \
            --iso-volume "MIGHTY_LINUX" \
            --bootappend-live "boot=live components quiet splash"
          lb build

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          images=( *.iso )
          test "${#images[@]}" -gt 0
          sha256sum "${images[@]}" > SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: mighty-linux-iso
          path: |
            *.iso
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Remove previous releases and their tags (one-time cleanup)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[cleanup-releases]')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request(url, method='GET'):
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  if error.code == 404 and method == 'DELETE':
                      return None
                  raise

          page = 1
          old_releases = []
          while True:
              batch = request(f'{base}/releases?per_page=100&page={page}') or []
              if not batch:
                  break
              old_releases.extend(batch)
              page += 1

          for release in old_releases:
              request(f"{base}/releases/{release['id']}", 'DELETE')
              tag = urllib.parse.quote(release['tag_name'], safe='')
              request(f'{base}/git/refs/tags/{tag}', 'DELETE')
              print(f"Deleted release {release['id']} and tag {release['tag_name']}")
          print(f'Deleted {len(old_releases)} previous releases.')
          PY

      - name: Publish Mighty Linux Beta release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-beta.${{ github.run_number }}"
          name: "Mighty Linux Beta 1.0.0 (Build ${{ github.run_number }})"
          body: |
            Automated Mighty Linux Beta build based on Debian 12 (Bookworm). This is a Beta release and may still contain bugs.

            Desktop: XFCE + Openbox
            Application formats: DEB, Flatpak, AppImage
            Architecture: amd64

            See SHA256SUMS to verify the ISO download.
          prerelease: false
          files: |
            *.iso
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
