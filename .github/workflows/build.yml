name: Build MOS (Mighty OS) - Ultra Fixed

on:
  workflow_dispatch:

jobs:
  build-mos:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Blueprint
      uses: actions/checkout@v4

    - name: Set Up OS Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y live-build debootstrap systemd-container wget

    - name: Configure and Compile MOS ISO
      run: |
        # রুট ডিরেক্টরিতেই সরাসরি লাইভ বিল্ড কনফিগার করা (যাতে cd নিয়ে কোনো ঝামেলা না হয়)
        sudo lb config --architectures amd64 --distribution bookworm --binary-images iso-hybrid --archive-areas "main contrib non-free non-free-firmware"
        
        # ৩ জিবির নিচে রাখার জন্য প্রয়োজনীয় প্যাকেজ লিস্ট
        sudo mkdir -p config/package-lists
        sudo bash -c 'cat <<EOF > config/package-lists/mos-core.list.chroot
        xorg
        sddm
        plasma-desktop
        plasma-nm
        powerdevil
        kscreen
        dolphin
        konsole
        calamares
        firefox-esr
        EOF'

        # HDD অপ্টিমাইজেশন: Baloo (সার্চ ইনডেক্সার) বন্ধ
        sudo mkdir -p config/includes.chroot/etc/xdg
        sudo bash -c 'cat <<EOF > config/includes.chroot/etc/xdg/baloofilerc
        [Basic Settings]
        Indexing-Enabled=false
        EOF'

        # নিয়ন ডার্ক থিম সেটআপ
        sudo bash -c 'cat <<EOF > config/includes.chroot/etc/xdg/kdeglobals
        [KDE]
        LookAndFeelPackage=org.kde.breezedark.desktop
        EOF'

        # হাই এফপিএস এর জন্য উইন্ডো অ্যানিমেশন বন্ধ
        sudo bash -c 'cat <<EOF > config/includes.chroot/etc/xdg/kwinrc
        [org.kde.kdecoration2]
        theme=org.kde.breezedark
        [Compositing]
        Enabled=true
        AnimationSpeed=0
        Backend=OpenGL
        WindowsBlockCompositing=true
        EOF'

        # নতুন ইউজারের জন্য থিম প্রোফাইল কপি করা
        sudo mkdir -p config/includes.chroot/etc/skel/.config
        sudo cp config/includes.chroot/etc/xdg/kdeglobals config/includes.chroot/etc/skel/.config/kdeglobals
        sudo cp config/includes.chroot/etc/xdg/kwinrc config/includes.chroot/etc/skel/.config/kwinrc

        # ওয়ালপেপার ডিরেক্টরি তৈরি করে ডাউনলোড করা
        sudo mkdir -p config/includes.chroot/usr/share/wallpapers/mos-neon/contents/images/
        sudo wget -q -O config/includes.chroot/usr/share/wallpapers/mos-neon/contents/images/1920x1080.png "https://prodia.xyz" || echo "Wallpaper download skipped"

        # প্লাজমাতে ডিফল্ট ওয়ালপেপার রেজিস্ট্রি করা
        sudo bash -c 'cat <<EOF > config/includes.chroot/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc
        [Containments]
        plugin=org.kde.plasma.folder
        wallpaperplugin=org.kde.image
        [Containments][Wallpaper][org.kde.image][General]
        Image=/usr/share/wallpapers/mos-neon/contents/images/1920x1080.png
        EOF'

        # সব কনফিগারেশন শেষে সরাসরি ওএস কম্পাইল শুরু (sudo দিয়ে)
        sudo lb build

    - name: Release MOS ISO
      if: always() # ওএস তৈরি হোক বা না হোক, লগ ফাইল বা আইএসও আপলোড নিশ্চিত করতে
      uses: actions/upload-artifact@v4
      with:
        name: MOS-Mighty-Smooth-ISO
        path: "*.iso"
        compression-level: 0
